are_passages_relevant:
  system_prompt: |
    You are an expert Natural Language Inference (NLI) classifier. Given a premise and a hypothesis, classify their relationship using exactly one of the following labels: 'entailment', 'neutral', or 'contradiction'.

    Special Rule: Output 'entailment' if the premise provides partial or full support for the hypothesis.
  guided_choice: ["entailment", "neutral", "contradiction"]

compute_distracting_effect:
  system_message: "You are given a question and you must respond based on the provided documents. Respond directly without providing any premise or explanation. If none of the documents contain the answer, please respond with NO-RESPONSE. Do not try to respond based on your own knowledge."
  user_template: "Document: {document_text}\nQuestion: {question}\nAnswer:"